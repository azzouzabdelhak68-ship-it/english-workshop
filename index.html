<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E2A3A" />
    <title>English Workshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      @media print {
        .no-print, header.app-header, nav { display: none !important; }
        body { background: #fff !important; }
        .print-worksheet { box-shadow: none !important; border: none !important; max-width: 100% !important; margin: 0 !important; }
        .print-worksheet * { color: #000 !important; background: transparent !important; border-color: #cbd5d3 !important; opacity: 1 !important; }
        .print-worksheet header { background: #fff !important; }
        .print-worksheet li { break-inside: avoid; margin-bottom: 10mm; }
        .print-worksheet a[href]::after { content: " (" attr(href)")"; font-size: 9pt; word-break: break-all; }
        @page { margin: 14mm; }
      }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
